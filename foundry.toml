[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
auto_detect_solc = false
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
# The real Uniswap v4 PoolManager used by the launch tests needs transient storage.
evm_version = "cancun"
offline = true
ffi = false
fs_permissions = []

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[fmt]
line_length = 120
